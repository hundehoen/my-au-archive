<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .character-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .character-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            width: 320px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        /* Efek terangkat saat kursor menempel di gambar */
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        .character-card img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .character-name {
            padding: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn-back">← Back To Main Menu</a>
        <h1>Character</h1>
        <p>Klik pada foto karakter untuk membaca narasi lengkapnya.</p>

        <div class="character-grid">
            
            <!-- Karakter 1: Arkan -->
            <a href="arkan-detail.html" class="character-card">
                <img src="ch001.jpg" alt="Arkan">
                <div class="character-name">Arkan Ganendra</div>
            </a>

            <!-- Karakter 2: Luca -->
            <a href="luca-detail.html" class="character-card">
                <img src="ch002.jpg" alt="Luca">
                <div class="character-name">Luca Wijaya</div>
            </a>
            <!-- Karakter 3: Chiko -->
            <a href="chiko-detail.html" class="character-card">
                <img src="foto-chiko.jpg" alt="Chiko">
                <div class="character-name">Leo</div>
            </a>
            
        </div>
    </div>

</body>
</html>
